<style>
:root{--navy:#1b2a4a;--gold:#c59a3b;--paper:#f7f8fa;--ink:#1c2230;--mute:#667085;--line:#dfe3ea;--bad:#b42318;--ok:#18794e}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:52px;width:auto}
.brand{flex:1;min-width:180px}
.brand b{display:block;font:600 22px/1.1 Fraunces,Georgia,serif}
.brand span{font-size:13px;color:#d9c48f}
nav{display:flex;gap:8px}
nav a{color:#fff;text-decoration:none;padding:8px 14px;border-radius:99px;border:1px solid #ffffff40;font-weight:600;font-size:14px}
nav a.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
main{max-width:1100px;margin:0 auto;padding:18px 14px 60px}
h1{font:600 26px/1.2 Fraunces,Georgia,serif;margin:6px 0 4px}
p.sub{margin:0 0 16px;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.grid button{padding:0;border:0;background:#e6e9ef;aspect-ratio:1;cursor:pointer;overflow:hidden;border-radius:4px}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:600 16px Figtree,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.center{text-align:center;margin-top:18px}
.msg{padding:12px 14px;border-radius:10px;margin:12px 0;font-size:15px}
.msg.err{background:#fef3f2;color:var(--bad)}.msg.ok{background:#ecfdf3;color:var(--ok)}.msg.info{background:#fff;border:1px solid var(--line)}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}
input[type=range]{width:100%;accent-color:var(--gold)}
#stage{width:100%;max-width:640px;margin:0 auto;display:block;background:#e6e9ef;border-radius:8px;touch-action:none;cursor:grab}
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 0}
.strip img{height:56px;width:56px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer}
.strip img.on{border-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
dialog{border:0;padding:0;max-width:100vw;max-height:100vh;width:100vw;height:100dvh;background:#0b0f18;color:#fff}
dialog::backdrop{background:#000}
.lb{display:flex;flex-direction:column;height:100%}
.lb .top{display:flex;justify-content:space-between;padding:10px 12px;gap:8px;align-items:center}
.lb .pic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.lb .pic img{max-width:100%;max-height:100%;object-fit:contain}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);background:#00000099;color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
.lb .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="brand"><b id="hn"></b><span id="ht"></span></div>
  <nav><a href="#/" id="n1">Gallery</a><a href="#/upload" id="n2">Upload</a></nav>
</header>
<main id="app"></main>
<dialog id="lb"></dialog>

const adminKey = () => sessionStorage.getItem('uacKey') || '';
const api = async (path, opt) => { const r = await fetch('/api/' + path, opt); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Request failed. Please try again.'); return d; };

// ---------- Gallery ----------
const G = { list:[], event:'', done:false, busy:false };
async function gallery() {
  app.replaceChildren(el('h1', {textContent:CFG.gallery}), el('p', {className:'sub', textContent:'Browse, view and save photos from church events.'}));
  const chips = el('div', {className:'chips'}), grid = el('div', {className:'grid'}), more = el('div', {className:'center'}), note = el('div');
  app.append(chips, note, grid, more);
  G.list = []; G.done = false;
  const draw = () => { grid.replaceChildren(...G.list.map((p, i) => el('button', {title:'Open photo', onclick:() => openLb(G.list, i)}, el('img', {src:'/api/photo/' + p.id + '_t', loading:'lazy', alt:p.event || 'Church photo'})))); more.replaceChildren(G.done ? '' : el('button', {className:'btn ghost', textContent:'Load more', onclick:load})); };
  async function load() {
    if (G.busy) return; G.busy = true; note.replaceChildren();
    try {
      const before = G.list.length ? G.list[G.list.length-1].created : '';
      const rows = await api('photos?' + new URLSearchParams({ event:G.event, before }));
      G.list.push(...rows); G.done = rows.length < 24; draw();
      if (!G.list.length) note.append(el('div', {className:'msg info', textContent:'No photos yet. Be the first to upload one from the Upload page.'}));
    } catch (e) { note.append(el('div', {className:'msg err', textContent:e.message})); }
    G.busy = false;
  }
  try {
    const evs = await api('events');
    if (evs.length) { const mk = (label, v) => el('button', {className:'chip' + (G.event === v ? ' on' : ''), textContent:label, onclick:() => { G.event = v; G.list = []; chips.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.textContent === label)); load(); }}); chips.append(mk('Recent', ''), ...evs.map(e => mk(e.event, e.event))); }
  } catch (e) {}
  load();
}

// ---------- Large view ----------
function openLb(list, i) {
  const p = list[i], pic = el('img', {src:'/api/photo/' + p.id, alt:p.event || 'Church photo'});
  const share = async () => { const u = location.origin + '/#/p/' + p.id; try { navigator.share ? await navigator.share({ title:CFG.name, url:u }) : (await navigator.clipboard.writeText(u), alert('Link copied.')); } catch (e) {} };
  const acts = el('div', {className:'acts'}, el('a', {className:'btn gold', href:'/api/photo/' + p.id + '?dl=1', download:'', textContent:'Download Photo'}), el('button', {className:'btn ghost', textContent:'Share', onclick:share}));
  if (adminKey()) acts.append(el('button', {className:'btn ghost', textContent:'Remove photo', onclick: async () => { if (!confirm('Remove this photo for everyone?')) return; try { await api('photo/' + p.id, { method:'DELETE', headers:{'x-admin-key':adminKey()} }); lb.close(); route(); } catch (e) { alert(e.message); } }}));
  const nav = (d) => el('button', {className:'nv', style:d < 0 ? 'left:8px' : 'right:8px', textContent:d < 0 ? '‹' : '›', 'aria-label':d < 0 ? 'Previous photo' : 'Next photo', onclick:() => openLb(list, i + d)});
  lb.replaceChildren(el('div', {className:'lb'}, el('div', {className:'top'}, el('span', {textContent:p.event || ''}), el('button', {className:'btn ghost', textContent:'Close', onclick:() => lb.close()})), el('div', {className:'pic'}, pic, i > 0 ? nav(-1) : '', i < list.length - 1 ? nav(1) : ''), acts));
  if (!lb.open) lb.showModal();
}
lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });

// ---------- Upload + watermark editor ----------
async function upload() {
  app.replaceChildren(el('h1', {textContent:'Upload photos'}), el('p', {className:'sub', textContent:'Choose photos, check the church watermark, then publish. No account needed.'}));
  const logo = new Image(); logo.src = CFG.logo;
  try { await logo.decode(); } catch (e) { app.append(el('div', {className:'msg err', textContent:'The church logo (logo.png) is missing from the website. Uploads are switched off until it is added.'})); return; }
  const S = { items:[], cur:0, size:.2, op:.75, auto:true, lx:0, ly:0 };
  const file = el('input', {type:'file', accept:'image/*', multiple:true, hidden:true}), ev = el('input', {type:'text', maxLength:80, placeholder:'e.g. Sunday Service, Youth Retreat'});
  const stage = el('canvas', {id:'stage'}), strip = el('div', {className:'strip'}), msg = el('div'), bar = el('i');
  const pick = el('button', {className:'btn', textContent:'Choose photos', onclick:() => file.click()});
  const size = el('input', {type:'range', min:8, max:50, value:20}), op = el('input', {type:'range', min:15, max:100, value:75});
  const pub = el('button', {className:'btn gold', textContent:'Publish Photo', disabled:true}), reset = el('button', {className:'btn ghost', textContent:'Reset position', onclick:() => { S.auto = true; draw(); }});
  const editor = el('div', {className:'panel', hidden:true}, stage, strip, el('label', {textContent:'Logo size'}), size, el('label', {textContent:'Logo transparency (left is faint, right is solid)'}), op, el('p', {className:'sub', textContent:'Drag the logo on the photo to move it. The default bottom-right spot works well.'}), el('div', {className:'row'}, reset));
  const link = el('button', {className:'btn ghost', textContent:'Copy upload link for WhatsApp', onclick: async () => { const u = location.origin + '/#/upload'; try { await navigator.clipboard.writeText(u); link.textContent = 'Link copied'; } catch (e) { prompt('Copy this link:', u); } }});
  app.append(el('div', {className:'panel'}, pick, file, el('label', {textContent:'Event name (optional)'}), ev), editor, msg, el('div', {className:'panel'}, pub, el('div', {className:'bar'}, bar)), el('div', {className:'row'}, link));

  function geom(W, H) { const lw = S.size * W, lh = lw * logo.naturalHeight / logo.naturalWidth, m = .03 * W; return { lw, lh, x: S.auto ? W - m - lw : S.lx * W, y: S.auto ? H - m - lh : S.ly * H }; }
  function paint(ctx, bmp, W, H) { ctx.drawImage(bmp, 0, 0, W, H); const g = geom(W, H); ctx.globalAlpha = S.op; ctx.drawImage(logo, g.x, g.y, g.lw, g.lh); ctx.globalAlpha = 1; }
  function draw() { const it = S.items[S.cur]; if (!it) return; const k = Math.min(1, 900 / Math.max(it.bmp.width, it.bmp.height)); stage.width = Math.round(it.bmp.width * k); stage.height = Math.round(it.bmp.height * k); paint(stage.getContext('2d'), it.bmp, stage.width, stage.height); }
  size.oninput = () => { S.size = size.value / 100; draw(); }; op.oninput = () => { S.op = op.value / 100; draw(); };
  let drag = null;
  stage.onpointerdown = e => { const r = stage.getBoundingClientRect(), g = geom(stage.width, stage.height), px = (e.clientX - r.left) * stage.width / r.width, py = (e.clientY - r.top) * stage.height / r.height; drag = { dx:px - g.x, dy:py - g.y }; stage.setPointerCapture(e.pointerId); };
  stage.onpointermove = e => { if (!drag) return; const r = stage.getBoundingClientRect(), px = (e.clientX - r.left) * stage.width / r.width, py = (e.clientY - r.top) * stage.height / r.height; S.auto = false; S.lx = (px - drag.dx) / stage.width; S.ly = (py - drag.dy) / stage.height; draw(); };
  stage.onpointerup = stage.onpointercancel = () => { drag = null; };

  file.onchange = async () => {
    msg.replaceChildren(); const fs = [...file.files]; if (!fs.length) return;
    S.items = []; strip.replaceChildren();
    for (const f of fs) {
      if (!f.type.startsWith('image/')) { msg.append(el('div', {className:'msg err', textContent:f.name + ' is not a photo and was skipped.'})); continue; }
      try { const bmp = await createImageBitmap(f, { imageOrientation:'from-image' }); S.items.push({ f, bmp }); } catch (e) { msg.append(el('div', {className:'msg err', textContent:f.name + ' could not be opened and was skipped.'})); }
    }
    S.items.forEach((it, i) => { const t = el('img', {alt:'Photo ' + (i + 1), onclick:() => { S.cur = i; mark(); draw(); }}); const c = document.createElement('canvas'); c.width = c.height = 112; const x = c.getContext('2d'), s = Math.max(112 / it.bmp.width, 112 / it.bmp.height); x.drawImage(it.bmp, (112 - it.bmp.width * s) / 2, (112 - it.bmp.height * s) / 2, it.bmp.width * s, it.bmp.height * s); t.src = c.toDataURL(); strip.append(t); });

  const send = (fd, onp) => new Promise((ok, no) => { const x = new XMLHttpRequest(); x.open('POST', '/api/upload'); x.upload.onprogress = e => e.lengthComputable && onp(e.loaded / e.total); x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch (e) {} x.status < 300 ? ok(d) : no(new Error(d.error || 'Upload failed. Please try again.')); }; x.onerror = () => no(new Error('No connection. Check your internet and try again.')); x.send(fd); });

        const c = document.createElement('canvas'); c.width = W; c.height = H; paint(c.getContext('2d'), it.bmp, W, H);
        const t = document.createElement('canvas'), ts = Math.min(1, 600 / Math.max(W, H)); t.width = Math.round(W * ts); t.height = Math.round(H * ts); t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
        const fd = new FormData(); let q = .9, fb = await blob(c, q); while (fb.size > 4.2e6 && q > .5) { q -= .1; fb = await blob(c, q); } fd.append('file', fb, 'photo.jpg'); fd.append('thumb', await blob(t, .8), 'thumb.jpg'); fd.append('event', ev.value);
        await send(fd, f => { bar.style.width = ((done + f) / S.items.length * 100) + '%'; }); done++; bar.style.width = (done / S.items.length * 100) + '%';
        msg.replaceChildren(el('div', {className:'msg info', textContent:'Uploaded ' + done + ' of ' + S.items.length + '…'}));
      }
      msg.replaceChildren(el('div', {className:'msg ok', textContent:done + (done > 1 ? ' photos are' : ' photo is') + ' now published. Thank you!'}), el('a', {className:'btn', href:'#/', textContent:'View the gallery'}));
      S.items = []; editor.hidden = true; file.value = ''; pub.textContent = 'Publish Photo'; bar.style.width = '0';
    } catch (e) { msg.replaceChildren(el('div', {className:'msg err', textContent:e.message + (done ? ' (' + done + ' uploaded before the problem.)' : '')})); pub.disabled = false; }
    pick.disabled = false;
  };
}

// ---------- Removal page ----------
function remove() {
  const k = el('input', {type:'password', placeholder:'Removal key', autocomplete:'off'}), out = el('div');
  app.replaceChildren(el('h1', {textContent:'Remove photos'}), el('p', {className:'sub', textContent:'Enter the removal key to show Remove buttons in the gallery on this device.'}), el('div', {className:'panel'}, k, el('div', {className:'center'}, el('button', {className:'btn', textContent:'Save key', onclick:() => { sessionStorage.setItem('uacKey', k.value); out.replaceChildren(el('div', {className:'msg ok', textContent:'Saved for this browser session. Open a photo in the gallery to remove it.'})); }}), el('button', {className:'btn ghost', textContent:'Sign out', onclick:() => { sessionStorage.removeItem('uacKey'); out.replaceChildren(el('div', {className:'msg info', textContent:'Key cleared.'})); }})), out));
}

// ---------- Router ----------
async function route() {
  const h = location.hash || '#/';
  $('#n1').classList.toggle('on', !h.startsWith('#/upload') && !h.startsWith('#/remove')); $('#n2').classList.toggle('on', h.startsWith('#/upload'));
  if (lb.open) lb.close();
  if (h.startsWith('#/upload')) return upload();
  if (h.startsWith('#/remove')) return remove();
  await gallery();
  const m = h.match(/^#\/p\/([a-f0-9]{16})$/); if (m) openLb([{ id:m[1], event:'' }], 0);
}
addEventListener('hashchange', route); route();
</script>
